[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidravia-drcom-acceptance"
version = "0.1.0"
description = "Offline-first Windows Dr.COM acceptance infrastructure for Sidravia"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sidravia-drcom-acceptance = "sidravia_drcom_acceptance.__main__:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
