name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scope: all
          - os: windows-latest
            scope: go
          - os: macos-latest
            scope: go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
      - name: Run public repository verifier
        run: python tools/developer/verify_repository.py --scope ${{ matrix.scope }} --go go
      - name: Verify release scheduled-task ownership
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/developer/test_release_task_ownership.ps1
