name: Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Canonical product version, no leading v'
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  FLUTTER_FRAMEWORK_SHA: '4cf24164269a5ebf0c16a028a00727d0e77bbb05'

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            flutterArch: x64
          - os: windows-11-arm
            target: windows-arm64
            flutterArch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_ID: ${{ github.sha }}
      BUILD_TARGET: ${{ matrix.target }}
      FLUTTER_ARCH: ${{ matrix.flutterArch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - name: Test artifact producer and consumer contracts
        if: matrix.flutterArch == 'x64'
        shell: bash
        run: |
          go test -count=1 ./tools/build
          python -m unittest discover -s tools/developer/tests -v
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: matrix.flutterArch == 'x64'
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Bootstrap pinned native ARM64 Flutter SDK
        if: matrix.flutterArch == 'arm64'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-arm64'
          # Stable SDK bundles for 3.47.0 are x64. The pinned framework
          # bootstraps the official ARM64 Dart SDK and engine artifacts.
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0 -or (git -C $sdk rev-parse HEAD) -cne $env:FLUTTER_FRAMEWORK_SHA) { throw 'flutter_source_mismatch' }
          (Join-Path $sdk 'bin') >> $env:GITHUB_PATH
      - name: Build fresh Windows GUI Release
        shell: pwsh
        working-directory: gui
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'flutter_dependencies_failed' }
          flutter build windows --release --no-pub --target lib/main.dart --build-name $env:BUILD_VERSION --build-number 1
          if ($LASTEXITCODE -ne 0) { throw 'flutter_release_failed' }
          $actual = (Get-Item ("build/windows/$env:FLUTTER_ARCH/runner/Release/Sidravia.exe")).VersionInfo.ProductVersion
          if ($actual -cne ($env:BUILD_VERSION + '+1')) { throw 'gui_version_mismatch' }
      - name: Prepare pinned Inno compiler on disposable runner
        shell: pwsh
        run: |
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'sidravia-inno-7.1.0'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'inno_checksum_mismatch' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $compilerRoot + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $compilerRoot 'ISCC.exe'))) { throw 'inno_compiler_setup_failed' }
          "SIDRAVIA_ISCC=$(Join-Path $compilerRoot 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Build and consume Windows distribution
        id: windows_distribution
        shell: pwsh
        run: |
          $gui = (Resolve-Path ("gui/build/windows/$env:FLUTTER_ARCH/runner/Release")).Path
          go run -mod=readonly ./tools/build --version $env:BUILD_VERSION --build-id $env:BUILD_ID --artifact distribution --target $env:BUILD_TARGET --output dist --go go --gui-directory $gui --iscc $env:SIDRAVIA_ISCC
          if ($LASTEXITCODE -ne 0) { throw 'windows_distribution_failed' }
          $setup = Get-Item (Join-Path dist ('sidravia-v' + $env:BUILD_VERSION + '-' + $env:BUILD_TARGET + '-setup.exe'))
          if ($setup.VersionInfo.ProductVersion.TrimEnd() -cne $env:BUILD_VERSION) { throw 'installer_version_mismatch' }
          python tools/developer/verify_distribution.py --directory dist --target $env:BUILD_TARGET --version $env:BUILD_VERSION --build-id $env:BUILD_ID --gui-directory $gui --go go --smoke > verification.json
          if ($LASTEXITCODE -ne 0) { throw 'windows_artifact_verification_failed' }
          go run -mod=readonly ./tools/build --version $env:BUILD_VERSION --build-id $env:BUILD_ID --artifact distribution --target $env:BUILD_TARGET --output dist-core --go go
          if ($LASTEXITCODE -ne 0) { throw 'windows_core_distribution_failed' }
          python tools/developer/verify_distribution.py --directory dist-core --target $env:BUILD_TARGET --version $env:BUILD_VERSION --build-id $env:BUILD_ID --go go --smoke > core-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'windows_core_verification_failed' }
      - name: Run isolated Setup script contracts
        if: matrix.flutterArch == 'x64'
        shell: pwsh
        env:
          SIDRAVIA_INNO_TEST_ROOT: ${{ runner.temp }}
        run: python -m unittest discover -s tools/developer/tests -p test_inno_installer.py -v
      - name: Exercise ARM64 portable and Setup through live IPC
        if: ${{ !cancelled() && matrix.flutterArch == 'arm64' && steps.windows_distribution.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/developer/windows_arm64_smoke.py --distribution dist --core-distribution dist-core --version $env:BUILD_VERSION --build-id $env:BUILD_ID --evidence windows-native-smoke
      - name: Preserve Windows ARM64 smoke evidence
        if: always() && matrix.flutterArch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sidravia-windows-arm64-native-evidence
          path: windows-native-smoke/*
          if-no-files-found: ignore
      - name: Summarize verified candidate
        shell: bash
        run: |
          printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat verification.json >> "$GITHUB_STEP_SUMMARY"
          if test -f core-verification.json; then
            cat core-verification.json >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Stage verified Windows artifacts
        shell: pwsh
        run: |
          $base = "sidravia-v$env:BUILD_VERSION-$env:BUILD_TARGET"
          foreach ($file in @("dist/$base-gui-portable.zip", "dist/$base-setup.exe", 'dist/SHA256SUMS.txt',
                              "dist-core/$base-core-portable.zip", 'dist-core/SHA256SUMS.txt',
                              'verification.json', 'core-verification.json')) {
            $item = Get-Item -LiteralPath $file
            if ($item.PSIsContainer -or $item.Length -eq 0) { throw "Missing Windows artifact: $file" }
          }
          New-Item -ItemType Directory -Path windows-candidate | Out-Null
          Move-Item -LiteralPath dist -Destination windows-candidate/gui
          Move-Item -LiteralPath dist-core -Destination windows-candidate/core
          Move-Item -LiteralPath verification.json -Destination windows-candidate/
          Move-Item -LiteralPath core-verification.json -Destination windows-candidate/
          Move-Item -LiteralPath "gui/build/windows/$env:FLUTTER_ARCH/runner/Release" -Destination windows-candidate/gui-input
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sidravia-v${{ inputs.version }}-${{ matrix.target }}
          path: windows-candidate
          include-hidden-files: true
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
        distribution:
          - image: registry.fedoraproject.org/fedora:45
            package: rpm
          - image: debian:13
            package: deb
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.distribution.image }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_TARGET: ${{ matrix.platform.target }}
      PACKAGE_TYPE: ${{ matrix.distribution.package }}
    steps:
      - name: Install build dependencies in the target distribution
        run: |
          if [[ "$PACKAGE_TYPE" == rpm ]]; then
            dnf -y install git curl tar gzip xz unzip which python3 clang cmake ninja-build gcc-c++ \
              gtk3-devel webkit2gtk4.1-devel libayatana-appindicator-gtk3-devel wayland-devel \
              rpm-build desktop-file-utils hicolor-icon-theme xdg-utils mesa-libGLU jq zip
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates git curl tar gzip xz-utils unzip python3 clang cmake ninja-build g++ \
              pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libwayland-dev \
              debhelper desktop-file-utils hicolor-icon-theme xdg-utils libglu1-mesa jq zip build-essential
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Bootstrap pinned native Flutter SDK
        run: |
          sdk="$RUNNER_TEMP/flutter-sdk"
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$FLUTTER_FRAMEWORK_SHA"
          "$sdk/bin/flutter" --version
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Provide pinned XZ encoder
        if: matrix.distribution.package == 'rpm'
        run: |
          if [[ "$(xz --version | head -n 1)" == 'xz (XZ Utils) 5.8.3' ]]; then
            exit 0
          fi
          encoder="$RUNNER_TEMP/xz-encoder"
          mkdir -p "$encoder"
          curl --fail --silent --show-error --location \
            https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz \
            --output "$encoder/xz-5.8.3.tar.xz"
          (cd "$encoder"; sha256sum --check <<< 'fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6  xz-5.8.3.tar.xz')
          tar -xJf "$encoder/xz-5.8.3.tar.xz" -C "$encoder"
          cmake -G Ninja -S "$encoder/xz-5.8.3" -B "$encoder/build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$encoder/build" --target xz
          test "$("$encoder/build/xz" --version | head -n 1)" = 'xz (XZ Utils) 5.8.3'
          echo "$encoder/build" >> "$GITHUB_PATH"
      - name: Build and verify native Linux packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          out="$GITHUB_WORKSPACE/.local/ci-artifacts"
          mkdir -p "$out/work" "$out/system/gui" "$out/system/core"
          work="$out/work"
          python3 tools/developer/dev.py linux --package --version "$BUILD_VERSION" \
            --flutter "$(command -v flutter)" --output "$work/gui"
          python3 tools/developer/dev.py package --target "$BUILD_TARGET" --version "$BUILD_VERSION" \
            --output "$work/core" --reports "$work/checks"
          tarname="sidravia-v$BUILD_VERSION-$BUILD_TARGET"
          python3 tools/developer/dev.py linux "--$PACKAGE_TYPE" "$work/gui/$tarname-gui-portable.tar.gz" \
            --output "$work/system-gui"
          python3 tools/developer/dev.py linux "--$PACKAGE_TYPE-core" "$work/core/$tarname-core-portable.tar.gz" \
            --version "$BUILD_VERSION" --output "$work/system-core"
          for kind in gui core; do
            packages=("$work/system-$kind/"*."$PACKAGE_TYPE")
            test "${#packages[@]}" -eq 1
            package="${packages[0]}"
            test -s "$package"
            test -s "$package.json"
            test -s "$work/system-$kind/SHA256SUMS"
            cp "$package" "$package.json" "$work/system-$kind/SHA256SUMS" "$out/system/$kind/"
            test -s "$out/system/$kind/${package##*/}"
          done
      - name: Build XZ variants from the verified Linux payloads
        if: matrix.distribution.package == 'rpm'
        run: |
          out="$GITHUB_WORKSPACE/.local/ci-artifacts"
          work="$out/work"
          portable="$out/portable"
          mkdir "$portable"
          cp "$work/gui.producer/receipt.json" "$portable/verification.json"
          cp "$work"/checks/*/stage-1.log "$portable/core-verification.json"
          mv "$work/gui.producer/gui" "$portable/gui-input"
          for kind in gui core; do
            gui=()
            if [[ "$kind" == gui ]]; then
              gui=(--gui-directory "$portable/gui-input")
            fi
            mv "$work/$kind" "$portable/$kind"
            go run -mod=readonly ./tools/build --artifact distribution --compression xz \
              --target "$BUILD_TARGET" --version "$BUILD_VERSION" --build-id "$GITHUB_SHA" \
              --output "$portable/$kind-xz" --go go "${gui[@]}"
            python3 tools/developer/verify_distribution.py --directory "$portable/$kind-xz" \
              --target "$BUILD_TARGET" --version "$BUILD_VERSION" --build-id "$GITHUB_SHA" \
              --go go "${gui[@]}" > "$portable/$kind-xz-verification.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sidravia-v${{ inputs.version }}-${{ matrix.platform.target }}-${{ matrix.distribution.package }}
          path: .local/ci-artifacts/system
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.distribution.package == 'rpm'
        with:
          name: sidravia-v${{ inputs.version }}-${{ matrix.platform.target }}
          path: .local/ci-artifacts/portable
          include-hidden-files: true
          if-no-files-found: error

  release-candidate:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sidravia-v${{ inputs.version }}-*
          path: candidate/inputs
      - name: Assemble verified public assets and manifest requests
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: python3 tools/developer/stage_release.py --directory candidate --version "$BUILD_VERSION" --build-id "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-v${{ inputs.version }}
          path: candidate
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
