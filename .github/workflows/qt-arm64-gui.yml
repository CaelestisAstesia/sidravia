name: Build native Flutter inputs for Qt ARM64 acceptance

on:
  push:
    branches: [codex/qt-arm64-github-test]
    paths:
      - .github/workflows/qt-arm64-gui.yml
      - .github/scripts/build-qt-arm64-gui.ps1

permissions:
  contents: read

jobs:
  gui:
    runs-on: windows-11-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build release runtimes for both fixture versions
        shell: pwsh
        run: .github/scripts/build-qt-arm64-gui.ps1 -Output qt-gui
      - name: Check the actual executable and Flutter engine PE targets
        shell: pwsh
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'tools/developer'); from verify_distribution import matches_pe; paths = [Path('qt-gui') / version / image for version in ('0.6.0-rc.1','0.6.0') for image in ('Sidravia.exe','flutter_windows.dll')]; assert all(matches_pe(path.read_bytes(), 'arm64') for path in paths), paths; print('Both executables and Flutter engines are ARM64 PE images.')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qt-arm64-test-gui-runtimes
          path: qt-gui/
          if-no-files-found: error
          retention-days: 1
