name: Qt Windows ARM64 acceptance

on:
  push:
    branches: [codex/qt-arm64-github-test]
    paths:
      - .github/scripts/build-qt-arm64-test-kit.ps1
      - .github/scripts/prepare-qt-arm64-test.py
      - packaging/windows/ifw/build.ps1
  workflow_call:
    inputs:
      toolkit_run:
        type: number
        required: true
      standard_user:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  GOTOOLCHAIN: local

jobs:
  ifw-source:
    if: ${{ !inputs.toolkit_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare the exact pinned IFW source archive
        shell: bash
        run: |
          revision=aac2cf9c93b80a0f5959ab6c8a00bc378c54fdec
          git init ifw-source
          git -C ifw-source fetch --depth=1 https://github.com/qtproject/installer-framework.git "$revision"
          git -C ifw-source -c core.autocrlf=false archive --format=tar --prefix=ifw/ --output="$PWD/ifw-4.11.0-source.tar" "$revision"
          printf '%s  %s\n' f1a21e3e639a5249708e4c954297b25e426effbe461b63608c91f7e86a2396df ifw-4.11.0-source.tar | sha256sum --check --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qt-ifw-pinned-source
          path: ifw-4.11.0-source.tar
          if-no-files-found: error
          retention-days: 1

  toolkit:
    needs: ifw-source
    if: ${{ !inputs.toolkit_run }}
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qt-ifw-pinned-source
          path: ifw-source
      - name: Build the ARM64 target Qt toolkit on x64
        shell: pwsh
        run: .github/scripts/build-qt-arm64-test-kit.ps1 -Work "$env:RUNNER_TEMP/qt-build" -Output qt-toolkit -FrameworkArchive "$PWD/ifw-source/ifw-4.11.0-source.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qt-arm64-target-test-kit
          path: qt-toolkit/*.exe
          if-no-files-found: error
          retention-days: 1

  acceptance:
    needs: toolkit
    if: ${{ always() && !cancelled() && (needs.toolkit.result == 'success' || inputs.toolkit_run > 0) }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          architecture: arm64
          cache-dependency-path: go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
          architecture: arm64
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
          require-checksums: true
          cache-dependency-glob: tools/developer/acceptance/uv.lock
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
          checksum: '4618ea027582738a056af9a5b78086c402e93c82c1c67df0eab2d20c649608e2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ !inputs.toolkit_run }}
        with:
          name: qt-arm64-target-test-kit
          path: qt-toolkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ inputs.toolkit_run > 0 }}
        with:
          name: qt-arm64-target-test-kit
          path: qt-toolkit
          github-token: ${{ github.token }}
          run-id: ${{ inputs.toolkit_run }}
      - name: Bootstrap pinned native ARM64 Flutter SDK
        shell: pwsh
        run: |
          if ((go env GOHOSTARCH) -cne 'arm64') { throw 'expected native ARM64 Go tooling' }
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-arm64'
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0 -or (git -C $sdk rev-parse HEAD) -cne '4cf24164269a5ebf0c16a028a00727d0e77bbb05') { throw 'flutter_source_mismatch' }
          (Join-Path $sdk 'bin') >> $env:GITHUB_PATH
      - name: Build and sign both native Windows release fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $kit = (Resolve-Path qt-toolkit).Path
          $out = (New-Item -ItemType Directory -Path (Join-Path $env:PUBLIC ('SidQt-' + $env:GITHUB_RUN_ID))).FullName
          "QT_FIXTURE_ROOT=$out" >> $env:GITHUB_ENV
          foreach ($version in '0.6.0-rc.1','0.6.0') {
            Push-Location gui
            try {
              flutter pub get --enforce-lockfile
              flutter build windows --release --no-pub --target lib/main.dart --build-name $version --build-number 1
              $gui = (Resolve-Path 'build/windows/arm64/runner/Release').Path
            } finally { Pop-Location }
            go run -mod=readonly ./tools/build --version $version --build-id $env:GITHUB_SHA --artifact distribution --target windows-arm64 --output (Join-Path $out $version) --go go --gui-directory $gui --ifw $kit
          }
          go build -mod=readonly -o (Join-Path $out 'signrelease.exe') ./tools/signrelease
          go test -c -mod=readonly -o (Join-Path $out 'qt-handoff.test.exe') ./internal/update
          python .github/scripts/prepare-qt-arm64-test.py --workspace $out --toolkit $kit --build $env:GITHUB_SHA
      - name: Run native Qt lifecycle
        if: ${{ !inputs.standard_user }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SIDRAVIA_IFW_ISOLATED_WINDOWS = '1'
          $env:SIDRAVIA_QT_ACCEPTANCE_REQUEST = Join-Path $env:QT_FIXTURE_ROOT 'qt-acceptance.json'
          $null = New-Item -ItemType Directory -Path qt-evidence -Force
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          [pscustomobject]@{
            administrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            session = (Get-Process -Id $PID).SessionId
          } | ConvertTo-Json | Set-Content qt-evidence/runner-context.json
          task --exit-code accept:windows-qt -- --basetemp qt-evidence/lifecycle --junitxml qt-evidence/junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native Qt lifecycle as a standard user
        if: ${{ inputs.standard_user }}
        shell: pwsh
        run: .github/scripts/accept-qt-arm64-as-standard-user.ps1 -Work $env:QT_FIXTURE_ROOT
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qt-arm64-acceptance-evidence
          path: |
            qt-evidence/runner-context.json
            qt-evidence/junit.xml
            qt-evidence/acceptance.log
            qt-evidence/lifecycle/**/*.log
            qt-evidence/lifecycle/**/qt-outcome.json
          if-no-files-found: ignore
          retention-days: 7
