name: sidravia_gui
description: Sidravia desktop and mobile client.
publish_to: none
version: 0.5.0-alpha.1+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: 2.1.6
  http: 1.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/SourceCodePro-LICENSE.md
  fonts:
    - family: Source Code Pro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.otf
          weight: 400
